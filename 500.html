<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 — خطأ في الخادم | أساسات المشاعر المحدودة</title>
  <link rel="icon" type="image/jpeg" href="img/LOGO.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Readex+Pro:wght@400;600;700;800&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles/variables.css" />
  <link rel="stylesheet" href="src/styles/main.css" />
  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: radial-gradient(circle at center, #ffffff 0%, #f8fafc 100%);
      text-align: center;
    }
    .error-card {
      background: #ffffff;
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      padding: 3.5rem 2.5rem;
      max-width: 600px;
      width: 100%;
      box-shadow: var(--shadow-glow-strong);
    }
    .error-code {
      font-size: 6rem;
      font-weight: 900;
      font-family: var(--font-latin);
      line-height: 1;
      color: #ef4444;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }
    .error-desc {
      font-size: 1.05rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .error-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="error-page-wrapper">
    <div class="error-card">
      <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
        <img src="img/LOGO.jpeg" alt="أساسات المشاعر المحدودة" style="height: 48px; border-radius: 8px; border: 1px solid var(--border-subtle); padding: 2px 6px;" />
      </div>
      <div class="error-code">500</div>
      <h1 class="error-title">حدث خطأ غير متوقع في الخادم</h1>
      <p class="error-desc">نعتذر عن هذا الخطأ المؤقت. يعمل فريقنا الفني على حل المشكلة واستعادة الخدمة في أقرب وقت.</p>
      <div class="error-actions">
        <button onclick="location.reload()" class="btn-primary">
          <span>إعادة المحاولة</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>
        <a href="index.html" class="btn-secondary">
          <span>الصفحة الرئيسية</span>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
